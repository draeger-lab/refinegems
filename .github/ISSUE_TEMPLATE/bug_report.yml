name: Bug report
description: Report undesired behaviour in refineGEMs.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve refineGEMs. Please include enough detail for maintainers to reproduce the problem.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened, and what made it unexpected?
      placeholder: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include commands, scripts, model/media inputs, or database entries where relevant.
      placeholder: |
        1. Install ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect refineGEMs to do instead?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual output or error message
      description: Paste the full traceback, command output, or unexpected result.
      render: text

  - type: input
    id: refinegems-version
    attributes:
      label: refineGEMs version or commit
      placeholder: "2.0.0-beta.1, main@abc1234, etc."
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.10, 3.11, 3.12, ..."
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS, Linux, Windows, Docker, HPC environment, ..."
    validations:
      required: true

  - type: textarea
    id: installation
    attributes:
      label: Installation and optional dependencies
      description: Tell us how refineGEMs was installed and whether optional tools or extras are involved.
      placeholder: "pip install refinegems, pip install -e \".[docs]\", conda environment, Docker, ModelPolisher, MCC, BOFdat, ..."

  - type: textarea
    id: data
    attributes:
      label: Input data or workflow context
      description: Describe the model, medium, database entry, file format, or workflow. Do not share private data unless allowed.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, links, related issues, or anything else that may help.
