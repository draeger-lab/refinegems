name: Publish refineGEMs Docker image to Docker Hub

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: "I understand this run publishes an image to Docker Hub"
        required: true
        default: false
        type: boolean
      publish_latest:
        description: "Also update the latest tag for this manual run"
        required: true
        default: false
        type: boolean

jobs:
  validate-and-test:
    name: Validate Docker release and smoke-test image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      checkout_ref: ${{ steps.vars.outputs.checkout_ref }}
      publish_latest: ${{ steps.vars.outputs.publish_latest }}
      version: ${{ steps.vars.outputs.version }}
      version_tag: ${{ steps.vars.outputs.version_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Docker tags
        id: vars
        env:
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish || 'false' }}
          MANUAL_PUBLISH_LATEST: ${{ inputs.publish_latest || 'false' }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$CONFIRM_PUBLISH" != "true" ]; then
            echo "::error::Confirm the Docker Hub publish checkbox before running this workflow."
            exit 1
          fi

          if [ "$REF_TYPE" = "tag" ]; then
            VERSION_TAG="$REF_NAME"
          else
            echo "::error::Manual Docker Hub publishing must be dispatched from a Git tag."
            exit 1
          fi

          VERSION="${VERSION_TAG#v}"
          echo "checkout_ref=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          if [ "$MANUAL_PUBLISH_LATEST" = "true" ]; then
            echo "publish_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: refinegems:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test command line entry point
        run: docker run --rm refinegems:smoke-test -h

  build-and-push:
    name: Publish refineGEMs Docker image
    runs-on: ubuntu-latest
    needs: validate-and-test
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-and-test.outputs.checkout_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Docker tags
        id: docker_tags
        env:
          IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/refinegems
          PUBLISH_LATEST: ${{ needs.validate-and-test.outputs.publish_latest }}
          VERSION: ${{ needs.validate-and-test.outputs.version }}
          VERSION_TAG: ${{ needs.validate-and-test.outputs.version_tag }}
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${VERSION}"
            if [ "$VERSION" != "$VERSION_TAG" ]; then
              echo "${IMAGE_NAME}:${VERSION_TAG}"
            fi
            if [ "$PUBLISH_LATEST" = "true" ]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/refinegems
          readme-filepath: ./README.md
